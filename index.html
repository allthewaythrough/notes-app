<!doctype html><html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f8fa"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Denný plán"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><title>Denný plán</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#19212c;background:#f7f8fa;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #8db9ff;outline-offset:2px}.app{max-width:700px;margin:auto;padding:calc(env(safe-area-inset-top) + 22px) 18px calc(env(safe-area-inset-bottom) + 50px)}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}h1{font-size:31px;letter-spacing:-1.2px;margin:0}.iconbtn{border:0;background:white;border-radius:13px;width:44px;height:44px;font-size:22px;box-shadow:0 2px 10px #1720330a}.card{background:white;border-radius:25px;padding:18px;box-shadow:0 5px 25px #15203608}.monthnav{display:flex;justify-content:space-between;align-items:center;margin-bottom:19px}.monthnav strong{font-size:19px;text-transform:capitalize}.arrows{display:flex;gap:8px}.arrows button{border:0;background:#f3f5f8;border-radius:11px;width:38px;height:38px;font-size:23px}.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;text-align:center}.weekday{font-size:12px;color:#8c96a5;font-weight:700;padding:8px 0}.day{border:0;background:transparent;min-height:57px;border-radius:13px;position:relative;color:#202a37;font-weight:600}.day.outside{color:#c3cad4}.day.today:not(.selected){color:#2167d9;background:#eff5ff}.day.selected{background:#2476ec;color:white}.dot{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:#2978ef}.selected .dot{background:white}.section{display:flex;justify-content:space-between;align-items:center;margin:30px 2px 15px;gap:10px}.section h2{font-size:21px;letter-spacing:-.5px;margin:0}.add{border:0;background:#2476ec;color:white;padding:12px 17px;border-radius:14px;font-weight:700}.items{display:grid;gap:9px}.item{background:white;border-radius:17px;display:flex;align-items:center;gap:12px;padding:14px;min-height:68px;box-shadow:0 3px 14px #15203608}.check{width:25px;height:25px;flex:none;accent-color:#2476ec;cursor:pointer}.itemtext{border:0;background:transparent;text-align:left;flex:1;min-width:0;padding:0;color:inherit}.itemtext b{display:block;font-size:13px;color:#6f7b8a;margin-bottom:4px}.itemtext span{white-space:pre-wrap;overflow-wrap:anywhere}.item.done .itemtext{opacity:.48;text-decoration:line-through}.empty{text-align:center;color:#8893a2;padding:48px 10px}.modal{position:fixed;inset:0;background:#0c182950;display:none;align-items:flex-end;justify-content:center;z-index:5}.modal.open{display:flex}.sheet{width:100%;max-width:550px;background:#fff;border-radius:25px 25px 0 0;padding:24px 20px calc(25px + env(safe-area-inset-bottom));max-height:95dvh;overflow:auto}.sheet h2{margin:0 0 20px}.field{display:block;font-size:13px;font-weight:700;color:#677385;margin:15px 0}.field input,.field textarea{display:block;width:100%;margin-top:8px;border:1px solid #dce2eb;border-radius:12px;padding:13px;font-size:16px;background:white;color:#182333}.field textarea{min-height:100px;resize:vertical}.actions{display:flex;gap:9px;margin-top:20px}.actions button{border:0;border-radius:12px;padding:14px;flex:1;font-weight:700}.primary{background:#2476ec;color:white}.secondary{background:#eef1f5;color:#28313e}.danger{background:#fff0f0;color:#c72f35}.settings-actions{display:grid;gap:10px}.settings-actions button{padding:15px;border:0;border-radius:13px;text-align:left;background:#f1f4f8}.small{font-size:13px;color:#798493;line-height:1.5}#fileInput{display:none}@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:24px}.app{padding-top:40px}}@media(prefers-reduced-motion:no-preference){.day,.add{transition:background .15s,transform .15s}.day:active,.add:active{transform:scale(.96)}}
</style></head><body><main class="app"><header><h1>Denný plán</h1><button class="iconbtn" id="settingsBtn" aria-label="Nastavenia">⚙</button></header><section class="card" aria-label="Kalendár"><div class="monthnav"><strong id="monthTitle"></strong><div class="arrows"><button id="prev" aria-label="Predchádzajúci mesiac">‹</button><button id="next" aria-label="Nasledujúci mesiac">›</button></div></div><div class="grid" id="calendar"></div></section><div class="section"><h2 id="dayTitle"></h2><button class="add" id="addBtn">+ Pridať</button></div><section class="items" id="items" aria-label="Poznámky"></section></main><div class="modal" id="editorModal" role="dialog" aria-modal="true" aria-labelledby="editorTitle"><div class="sheet"><h2 id="editorTitle">Nová poznámka</h2><form id="noteForm"><label class="field">Poznámka<textarea id="noteText" maxlength="5000" required placeholder="Čo potrebuješ urobiť?"></textarea></label><label class="field">Dátum<input id="noteDate" type="date" required></label><label class="field">Čas (nepovinný)<input id="noteTime" type="time"></label><div class="actions"><button type="button" class="secondary" id="cancelEdit">Zrušiť</button><button class="primary" type="submit">Uložiť</button></div><div class="actions" id="deleteRow" hidden><button type="button" class="danger" id="deleteBtn">Vymazať poznámku</button></div></form></div></div><div class="modal" id="settingsModal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle"><div class="sheet"><h2 id="settingsTitle">Nastavenia</h2><div class="settings-actions"><button id="exportBtn">↓ Exportovať zálohu (JSON)</button><button id="importBtn">↑ Importovať zálohu (JSON)</button><input type="file" id="fileInput" accept="application/json,.json"></div><p class="small">Poznámky sú uložené iba v tomto zariadení. Pravidelne si ukladaj zálohu mimo aplikácie. Import nahradí aktuálne poznámky.</p><div class="actions"><button id="closeSettings" class="primary">Hotovo</button></div></div></div><script>
'use strict';const $=id=>document.getElementById(id);const now=new Date();let selected=new Date(now.getFullYear(),now.getMonth(),now.getDate()),shown=new Date(selected.getFullYear(),selected.getMonth(),1),notes=[],editing=null,db;const pad=n=>String(n).padStart(2,'0');const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;const dateFrom=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};const fmt=(d,opt)=>new Intl.DateTimeFormat('sk-SK',opt).format(d);const validDate=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&key(dateFrom(s))===s;const validTime=s=>s===''||typeof s==='string'&&/^([01]\d|2[0-3]):[0-5]\d$/.test(s);
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open('denny-plan-db',1);r.onupgradeneeded=()=>r.result.createObjectStore('notes',{keyPath:'id'});r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}function transaction(mode,fn){return new Promise((resolve,reject)=>{const t=db.transaction('notes',mode),s=t.objectStore('notes');let result;try{result=fn(s)}catch(e){reject(e);return}t.oncomplete=()=>resolve(result?.result);t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error)})}async function load(){return new Promise((resolve,reject)=>{const t=db.transaction('notes'),r=t.objectStore('notes').getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}async function refresh(){notes=await load();render()}function render(){const title=fmt(shown,{month:'long',year:'numeric'});$('monthTitle').textContent=title.charAt(0).toUpperCase()+title.slice(1);const cal=$('calendar');cal.replaceChildren();for(const s of ['Po','Ut','St','Št','Pi','So','Ne']){const el=document.createElement('div');el.className='weekday';el.textContent=s;cal.append(el)}const start=(shown.getDay()+6)%7,days=new Date(shown.getFullYear(),shown.getMonth()+1,0).getDate(),count=Math.ceil((start+days)/7)*7;for(let i=0;i<count;i++){const d=new Date(shown.getFullYear(),shown.getMonth(),i-start+1),k=key(d),b=document.createElement('button');b.className='day'+(d.getMonth()!==shown.getMonth()?' outside':'')+(k===key(selected)?' selected':'')+(k===key(now)?' today':'');b.textContent=d.getDate();b.setAttribute('aria-label',fmt(d,{day:'numeric',month:'long',year:'numeric'}));b.setAttribute('aria-pressed',String(k===key(selected)));if(notes.some(n=>n.date===k)){const dot=document.createElement('span');dot.className='dot';b.append(dot)}b.onclick=()=>{selected=d;shown=new Date(d.getFullYear(),d.getMonth(),1);render()};cal.append(b)}$('dayTitle').textContent=fmt(selected,{weekday:'long',day:'numeric',month:'long'});const wrap=$('items');wrap.replaceChildren();const dayNotes=notes.filter(n=>n.date===key(selected)).sort((a,b)=>(a.time===''?1:b.time===''?-1:a.time.localeCompare(b.time))||a.createdAt-b.createdAt);if(!dayNotes.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='Na tento deň zatiaľ nemáš žiadne poznámky.';wrap.append(empty)}for(const n of dayNotes){const row=document.createElement('article');row.className='item'+(n.done?' done':'');const cb=document.createElement('input');cb.type='checkbox';cb.className='check';cb.checked=n.done;cb.setAttribute('aria-label','Označiť ako splnené: '+n.text);cb.onchange=async()=>{try{await transaction('readwrite',s=>s.put({...n,done:cb.checked}));await refresh()}catch(e){alert('Nepodarilo sa uložiť zmenu.');cb.checked=!cb.checked}};const btn=document.createElement('button');btn.className='itemtext';const time=document.createElement('b');time.textContent=n.time||'Bez času';const body=document.createElement('span');body.textContent=n.text;btn.append(time,body);btn.onclick=()=>openEditor(n);row.append(cb,btn);wrap.append(row)}}function modal(id,show){$(id).classList.toggle('open',show)}function openEditor(n=null){editing=n?.id??null;$('editorTitle').textContent=n?'Upraviť poznámku':'Nová poznámka';$('noteText').value=n?.text??'';$('noteDate').value=n?.date??key(selected);$('noteTime').value=n?.time??'';$('deleteRow').hidden=!n;modal('editorModal',true);setTimeout(()=>$('noteText').focus(),80)}$('prev').onclick=()=>{shown=new Date(shown.getFullYear(),shown.getMonth()-1,1);selected=new Date(shown.getFullYear(),shown.getMonth(),1);render()};$('next').onclick=()=>{shown=new Date(shown.getFullYear(),shown.getMonth()+1,1);selected=new Date(shown.getFullYear(),shown.getMonth(),1);render()};$('addBtn').onclick=()=>openEditor();$('cancelEdit').onclick=()=>modal('editorModal',false);$('noteForm').onsubmit=async e=>{e.preventDefault();const text=$('noteText').value.trim(),date=$('noteDate').value,time=$('noteTime').value;if(!text||!validDate(date)||!validTime(time)){alert('Skontroluj poznámku, dátum a čas.');return}const old=notes.find(n=>n.id===editing);const n={id:old?.id??crypto.randomUUID(),text,date,time,done:old?.done??false,createdAt:old?.createdAt??Date.now()};try{await transaction('readwrite',s=>s.put(n));selected=dateFrom(date);shown=new Date(selected.getFullYear(),selected.getMonth(),1);modal('editorModal',false);await refresh()}catch(err){alert('Poznámku sa nepodarilo uložiť.')}};$('deleteBtn').onclick=async()=>{if(!editing||!confirm('Naozaj vymazať túto poznámku?'))return;try{await transaction('readwrite',s=>s.delete(editing));modal('editorModal',false);await refresh()}catch(e){alert('Vymazanie zlyhalo.')}};$('settingsBtn').onclick=()=>modal('settingsModal',true);$('closeSettings').onclick=()=>modal('settingsModal',false);for(const id of ['editorModal','settingsModal'])$(id).addEventListener('click',e=>{if(e.target===$(id))modal(id,false)});document.addEventListener('keydown',e=>{if(e.key==='Escape'){modal('editorModal',false);modal('settingsModal',false)}});$('exportBtn').onclick=()=>{const data=JSON.stringify({app:'denny-plan',version:1,exportedAt:new Date().toISOString(),notes},null,2),url=URL.createObjectURL(new Blob([data],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=`denny-plan-zaloha-${key(new Date())}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),60000)};$('importBtn').onclick=()=>$('fileInput').click();$('fileInput').onchange=async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;try{if(file.size>10_000_000)throw Error('Súbor je príliš veľký.');const data=JSON.parse(await file.text());if(data.app!=='denny-plan'||data.version!==1||!Array.isArray(data.notes)||data.notes.length>50000)throw Error('Neplatný formát zálohy.');const ids=new Set();for(const n of data.notes){if(!n||typeof n.id!=='string'||!n.id||ids.has(n.id)||typeof n.text!=='string'||!n.text.trim()||n.text.length>5000||!validDate(n.date)||!validTime(n.time)||typeof n.done!=='boolean'||!Number.isFinite(n.createdAt))throw Error('Záloha obsahuje neplatné poznámky.');ids.add(n.id)}if(!confirm(`Importovať ${data.notes.length} poznámok? Všetky aktuálne poznámky sa nahradia. Najskôr si ich môžeš exportovať.`))return;await transaction('readwrite',s=>{s.clear();for(const n of data.notes)s.put({id:n.id,text:n.text,date:n.date,time:n.time,done:n.done,createdAt:n.createdAt})});await refresh();modal('settingsModal',false);alert('Záloha bola obnovená.')}catch(err){alert('Import zlyhal: '+err.message)}};(async()=>{try{db=await openDB();await refresh()}catch(e){alert('Úložisko nie je dostupné. Skontroluj nastavenia prehliadača.')}})();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
